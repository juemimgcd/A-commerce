# 静态检查、迁移、依赖审计和独立真实服务回归全部通过后才允许发布镜像。
name: backend
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.13.14-slim@sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce_ci
          POSTGRES_DB: commerce
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: src
      # 以下仅属于当次作业内的临时服务，不连接部署环境，也不发起支付请求。
      COMMERCE_DATABASE_URL: postgresql+asyncpg://commerce:commerce_ci@postgres:5432/commerce
      COMMERCE_REDIS_URL: redis://localhost:6379/0
      COMMERCE_AMQP_URL: amqp://unused:unused@localhost:5672/
      COMMERCE_PROVIDER_KEY: ci-placeholder-not-a-live-provider-key
      COMMERCE_CALLBACK_SECRET: ci-placeholder-not-a-live-callback-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: uv==0.12.2
      - name: Frozen dependency and static checks
        run: sh scripts/check.sh
      - name: Empty PostgreSQL migration and model consistency
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check
      - name: Dependency audit
        run: uv run --no-sync pip-audit --local

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv in an isolated tool environment
        run: |
          python3 -m venv "$RUNNER_TEMP/commerce-uv"
          "$RUNNER_TEMP/commerce-uv/bin/pip" install --disable-pip-version-check --only-binary=:all: uv==0.12.2
          echo "$RUNNER_TEMP/commerce-uv/bin" >> "$GITHUB_PATH"
      - name: Frozen dependencies
        run: uv sync --frozen --no-build --extra storage --extra mail
      - name: Disposable PostgreSQL, Redis, RabbitMQ and HTTP regressions
        run: uv run --no-sync python scripts/test_backend.py -q -W error::ResourceWarning
      - name: PostgreSQL, RabbitMQ, Sentinel failover and full deployment validation
        run: uv run --no-sync python scripts/validate_deployment.py --ha

  container:
    needs: [check, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    outputs:
      released: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_ALLOWED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate deployment configuration
        run: |
          bash -n scripts/release.sh deploy/deploy.sh deploy/roll-api.sh
          sh -n deploy/redis-node.sh deploy/redis-sentinel.sh
          cp .env.example .env
          docker compose --env-file .env -f deploy/compose.yaml config --quiet
          docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.redis-sentinel.yaml config --quiet
          docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.redis-sentinel.yaml -f deploy/compose.ha.yaml config --quiet
          docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.monitoring.yaml config --quiet
          docker compose --env-file .env -f deploy/compose.yaml run --rm --no-deps gateway haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
          docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.monitoring.yaml run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.monitoring.yaml run --rm --no-deps -v "$PWD/tests/prometheus-rules.yml:/etc/prometheus/rules-test.yml:ro" --entrypoint promtool prometheus test rules /etc/prometheus/rules-test.yml
          docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.monitoring.yaml run --rm --no-deps --entrypoint amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
          rm .env
      - name: Plan versioned release
        id: plan
        run: bash scripts/release.sh plan
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.plan.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build both architectures; publish new versions only
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.plan.outputs.publish == 'true' }}
          tags: |
            ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.tag }}
            ${{ steps.plan.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.plan.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
          sbom: true
      - name: Create tag and publish release assets
        if: steps.plan.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: bash scripts/release.sh publish

  deploy:
    needs: container
    if: needs.container.outputs.released == 'true' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.container.outputs.tag }}
    secrets: inherit
