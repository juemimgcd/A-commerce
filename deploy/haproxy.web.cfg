# 单网关开发/预发布基线。入口 IP 粗限流在本机内存中；跨 API 的业务额度在 Redis。
# 若扩成多个网关，不能把这些本地计数当成集群总额度。
global
    log stdout format raw local0
    maxconn 1024
    stats socket /tmp/commerce-admin.sock mode 600 level admin

defaults
    mode http
    log global
    # 不记录 URL 查询参数、凭证和请求体，只记录后端实例、状态及各阶段耗时。
    log-format "%ci:%cp [%tr] %ft %b/%s %ST %TR/%Tw/%Tc/%Tr/%Ta"
    timeout connect 2s
    timeout client 30s
    timeout server 20s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout queue 1s
    timeout check 3s
    # 不自动重放写请求；超时结果由客户端携原幂等键查询/重试。
    retries 0

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 2s

frontend commerce
    bind :8080
    acl callback path_beg /api/v1/callbacks/
    # 指标从容器网络按实例抓取，不能经负载均衡随机采样一个实例。
    http-request deny deny_status 404 if { path,url_dec -m beg /metrics }
    http-request del-header Forwarded
    http-request del-header X-Real-IP
    # Only the private Next service may supply the gateway-created browser IP.
    acl from_web src "${COMMERCE_WEB_IP}"
    acl valid_web_ip req.hdr_ip(X-Commerce-Client-IP) -m found
    http-request set-var(txn.client_ip) src
    http-request set-var(txn.client_ip) req.hdr_ip(X-Commerce-Client-IP) if from_web valid_web_ip
    http-request del-header X-Commerce-Client-IP
    http-request set-header X-Forwarded-For %[var(txn.client_ip)]
    http-request set-header X-Forwarded-Proto http
    # 两组入口预算独立，普通流量不能占用回调 IP 桶。
    http-request track-sc0 var(txn.client_ip) table public_ip unless callback
    http-request track-sc1 var(txn.client_ip) table callback_ip if callback
    http-request return status 429 content-type application/json string '{"error":{"code":"ENTRY_RATE_LIMITED","message":"入口请求过于频繁","retryable":true,"details":{}},"request_id":""}' hdr Retry-After 10 if !callback { sc_http_req_rate(0) gt 300 }
    http-request return status 429 content-type application/json string '{"error":{"code":"CALLBACK_RATE_LIMITED","message":"回调入口繁忙","retryable":true,"details":{}},"request_id":""}' hdr Retry-After 10 if callback { sc_http_req_rate(1) gt 600 }
    use_backend callback_api if callback
    default_backend public_api

backend public_ip
    stick-table type ip size 100k expire 30s store http_req_rate(10s)

backend callback_ip
    stick-table type ip size 10k expire 30s store http_req_rate(10s)

backend public_api
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready
    http-check expect status 200
    default-server check inter 2s fastinter 1s fall 2 rise 2 resolvers docker init-addr libc,none resolve-prefer ipv4 maxconn 80 maxqueue 40
    server api api:8000
    server api-secondary api-secondary:8000

backend callback_api
    option httpchk
    http-check send meth GET uri /health/ready
    http-check expect status 200
    # 回调不占用 public_api 的连接预算，且不回退到普通 API。
    server api-callbacks api-callbacks:8000 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none resolve-prefer ipv4 maxconn 16 maxqueue 16

# 只在容器网络提供只读状态；不映射到宿主机，不开启 stats admin 操作。
# 滚动脚本读取具体后端状态，不能只凭固定等待时间推断已经摘流/恢复。
listen internal_status
    bind :8081
    stats enable
    stats uri /stats
    stats hide-version
    http-request return status 200 if { path /health/ready } { nbsrv(public_api) gt 0 } { nbsrv(callback_api) gt 0 }
    http-request return status 503 if { path /health/ready }

# Browser traffic enters here. Raw API traffic retains the existing :8080 endpoint.
frontend storefront
    bind :8082
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    http-request set-header X-Commerce-Client-IP %[src]
    http-request set-header X-Forwarded-Proto http
    default_backend storefront_web

backend storefront_web
    option httpchk
    http-check send meth GET uri /api/health
    http-check expect status 200
    server web web:3000 check inter 5s fall 2 rise 2 resolvers docker init-addr libc,none resolve-prefer ipv4 maxconn 100 maxqueue 40
