# 只接受角色为 replica 且 WAL 重放落后不超过 16MiB 的节点。
# 此阈值不是时间或读后写一致性保证；交易读取不得连接本入口。
global
    log stdout format raw local0
    maxconn 256

defaults
    mode tcp
    log global
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout check 2s
    timeout queue 1s
    retries 0

listen catalog_replicas
    bind :5432
    balance leastconn
    option httpchk
    http-check send meth GET uri /replica?lag=16MB
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-1 pg-1:5432 check port 8008 maxconn 80 maxqueue 20
    server pg-2 pg-2:5432 check port 8008 maxconn 80 maxqueue 20
    server pg-3 pg-3:5432 check port 8008 maxconn 80 maxqueue 20

frontend readiness
    mode http
    bind :8081
    http-request return status 200 if { nbsrv(catalog_replicas) gt 0 }
    http-request return status 503
