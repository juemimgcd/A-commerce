# Prometheus rule_files 引用此文件；告警接收人和 Alertmanager 地址由部署环境配置。
groups:
  - name: commerce-background
    rules:
      - alert: CommerceBackgroundMissing
        expr: commerce_background_alive == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "后台进程超过 45 秒没有心跳"
          description: "检查对应 role 的进程、数据库连接与消息队列连接。"
      - alert: CommerceOutboxStalled
        expr: commerce_outbox_oldest_seconds > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "outbox 最老消息超过两分钟未发送"
      - alert: CommerceMoneyReview
        # 同一数据库快照在三个 API 上重复导出，先取 max 去重。
        expr: sum(max by (kind, status) (commerce_operations{status="manual_review",kind=~"payment|close|refund|reconcile"})) > 0 or max(commerce_reconciliation_open) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "资金操作或对账差异需要人工复核"
      - alert: CommerceOverdueOperations
        expr: commerce_operations_overdue > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "任务持续超过计划执行时间"
  - name: commerce-runtime
    rules:
      - alert: CommerceScrapeMissing
        expr: up{job=~"commerce-api|commerce-background|rabbitmq"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "服务指标采集失败"}
      - alert: CommerceHttpErrors
        expr: sum(rate(commerce_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(commerce_http_requests_total[5m])), 1) > 0.01
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "HTTP 5xx 比例超过 1%"}
      - alert: CommercePoolTimeout
        expr: increase(commerce_db_pool_timeouts_total[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: "数据库连接池出现等待超时"}
      - alert: CommerceQueueBacklog
        expr: rabbitmq_queue_messages_ready > 1000
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "消息队列积压持续超过 1000 条"}
      - alert: CommerceIsolationMessages
        expr: rabbitmq_queue_messages{queue="commerce.isolation.v1"} > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "隔离队列有待处理消息"}
  - name: commerce-redis
    rules:
      # /scrape 返回 HTTP 200 不代表 Redis 可达，必须同时检查 redis_up。
      - alert: CommerceRedisUnavailable
        expr: up{job=~"commerce-redis-.*"} == 0 or redis_up{job=~"commerce-redis-.*"} == 0 or redis_exporter_last_scrape_error{job=~"commerce-redis-.*"} != 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Redis 或 Sentinel 节点无法采集"}
      - alert: CommerceRedisMemoryHigh
        expr: redis_memory_used_bytes{job=~"commerce-redis-(cache|rate)"} / redis_memory_max_bytes > 0.8
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Redis 内存超过 maxmemory 的 80%"}
      - alert: CommerceRedisRateMemoryCritical
        expr: redis_memory_used_bytes{redis_group="rate"} / redis_memory_max_bytes > 0.9
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "限流 Redis 内存超过 90%，接近拒绝写入"}
      - alert: CommerceRedisWriteRejected
        expr: increase(redis_errors_total{job=~"commerce-redis-(cache|rate)",err=~"OOM|MISCONF|NOREPLICAS"}[5m]) > 0
        labels: {severity: critical}
        annotations: {summary: "Redis 因内存、持久化或副本不足拒绝命令"}
      - alert: CommerceRedisReplicationLinkDown
        expr: redis_master_link_up{job=~"commerce-redis-(cache|rate)"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Redis 副本与主节点的复制链路断开"}
      - alert: CommerceRedisReplicaLag
        # 此 lag 是副本 ACK 间隔，不是业务数据精确延迟。
        expr: redis_connected_slave_lag_seconds{job=~"commerce-redis-(cache|rate)"} > 5
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Redis 副本确认延迟超过 5 秒"}
      - alert: CommerceRedisPersistenceFailed
        expr: redis_rdb_last_bgsave_status{job=~"commerce-redis-(cache|rate)"} == 0 or redis_aof_last_write_status{redis_group="rate"} == 0 or redis_aof_last_bgrewrite_status{redis_group="rate"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Redis RDB 保存或 AOF 写入、重写失败"}
      - alert: CommerceRedisAofFsyncDelayed
        expr: increase(redis_aof_delayed_fsync{redis_group="rate"}[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: "限流 Redis 出现 AOF fsync 延迟"}
      - alert: CommerceRedisSlowCommands
        # SLOWLOG ID 是递增序号；不把有上限的 slowlog_length 当累计计数。
        expr: increase(redis_slowlog_last_id{job=~"commerce-redis-(cache|rate)"}[5m]) > 10
        labels: {severity: warning}
        annotations: {summary: "Redis 五分钟新增慢命令超过 10 条"}
      - alert: CommerceRedisSentinelQuorumLost
        expr: redis_sentinel_master_ckquorum_status{job="commerce-redis-sentinel"} == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "Sentinel 无法满足故障切换的 quorum 或多数派"}
      - alert: CommerceRedisSentinelTopology
        expr: redis_sentinel_masters{job="commerce-redis-sentinel"} != 2 or redis_sentinel_master_status{job="commerce-redis-sentinel"} == 0 or redis_sentinel_tilt{job="commerce-redis-sentinel"} != 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Sentinel 主节点状态、监控组数量或时钟保护异常"}
      - alert: CommerceRedisReplicaMissing
        expr: redis_sentinel_master_ok_slaves{job="commerce-redis-sentinel"} < 2
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Redis 组不足两个健康副本"}
      - alert: CommerceRedisRateNoReplica
        expr: redis_sentinel_master_ok_slaves{job="commerce-redis-sentinel",master_name="commerce-rate"} < 1
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "限流 Redis 无健康副本，写入可能被拒绝"}
